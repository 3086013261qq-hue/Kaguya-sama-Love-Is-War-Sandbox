name: Build fullstack worldbook

# Rebuild trigger: Stand appearance visual refinement v1.2
on:
  push:
    paths:
      - "tools/assemble_fullstack_worldbook.py"
      - ".github/workflows/build-worldbook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build worldbook
        run: python tools/assemble_fullstack_worldbook.py

      - name: Upload worldbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaguya-fullstack-worldbook-v1.0.0
          path: |
            build/worldbook/辉夜大小姐_秀知院大学_替身版_worldbook_v1.0.0.json
            build/worldbook/WORLDBOOK_ASSEMBLY_v1.0_QA.md
            build/worldbook/manifest_v1.0.0.json
          if-no-files-found: error

      - name: Commit validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "build/worldbook/辉夜大小姐_秀知院大学_替身版_worldbook_v1.0.0.json" \
            "build/worldbook/WORLDBOOK_ASSEMBLY_v1.0_QA.md" \
            "build/worldbook/manifest_v1.0.0.json"
          if git diff --cached --quiet; then
            echo "Validated outputs already match repository."
            exit 0
          fi
          git commit -m "build: assemble fullstack worldbook v1.0.0"
          git push origin HEAD:main
