name: Build fullstack character card

on:
  push:
    paths:
      - "tools/build_fullstack_card.py"
      - ".github/workflows/build-card.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare PNG cover and make assembler decoder-independent
        run: |
          mkdir -p build/card
          ffmpeg -loglevel error -y -i mvu/media/cover/kaguya_jojo_cover.webp build/card/_cover_candidate1.png
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_fullstack_card.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\nfrom PIL import Image\n', '\n')
          s = s.replace('COVER_WEBP = ROOT / "mvu/media/cover/kaguya_jojo_cover.webp"\n', '')
          old = '    with Image.open(COVER_WEBP) as im: im.convert("RGB").save(COVER_PNG, format="PNG", optimize=True)\n'
          new = '    if not COVER_PNG.exists(): raise RuntimeError("prepared PNG cover missing")\n'
          if old not in s:
              raise SystemExit('cover conversion line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check MVU modules
        run: |
          node --check modules/kaguya-verdict-mvu/src/player.mjs
          node --check modules/kaguya-verdict-mvu/src/lockscreen.mjs
          node --check modules/kaguya-verdict-mvu/src/app.mjs
          node --check modules/kaguya-verdict-mvu/src/statusbar.mjs
          python -m py_compile tools/build_fullstack_card.py

      - name: Build candidate1 JSON and PNG
        run: python tools/build_fullstack_card.py

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaguya-university-stand-candidate1
          path: |
            build/card/辉夜大小姐_秀知院大学_替身版_v1.0.0-candidate1.json
            build/card/辉夜大小姐_秀知院大学_替身版_v1.0.0-candidate1.png
            build/card/辉夜大小姐_秀知院大学_替身版_v1.0.0-candidate1-compat-dual.png
            build/card/CARD_ASSEMBLY_candidate1_QA.json
          if-no-files-found: error

      - name: Commit validated candidate outputs and fixed assembler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_fullstack_card.py build/card/
          if git diff --cached --quiet; then
            echo "Validated candidate outputs already match repository."
            exit 0
          fi
          git commit -m "build: assemble Kaguya fullstack candidate1"
          git push origin HEAD:main
