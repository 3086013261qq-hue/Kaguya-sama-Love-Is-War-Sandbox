name: Advance Kaguya card runtime ref

on:
  push:
    paths:
      - ".github/workflows/advance-runtime-ref.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance pinned runtime in deterministic card builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_fullstack_card.py')
          s = p.read_text(encoding='utf-8')
          old = 'RUNTIME_REF = "646933f016575ac4a18c30278edc115e8f0131ed"'
          new = 'RUNTIME_REF = "8870c98f6eb9350cdce697126978bb0021ae01a9"'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old runtime ref, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit runtime pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_fullstack_card.py
          git commit -m "build: pin candidate runtime to latest lifecycle fix"
          git push origin HEAD:main
